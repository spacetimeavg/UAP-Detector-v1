name: UAP Detector V1

on:
  schedule:
    # Nierówne minuty, aby ominąć szczyt obciążenia serwerów GitHuba
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

# Zapobiega nakładaniu się procesów (nowy run czeka lub jest pomijany, gdy stary jeszcze trwa)
concurrency:
  group: uap-detector-single-run
  cancel-in-progress: false

jobs:
  run-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Wymusza koniec joba po 15 min w razie zawieszenia

    permissions:
      contents: write

    steps:
      - name: Pobieranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache dla modelu YOLO
        uses: actions/cache@v4
        with:
          path: yolov8n.pt
          key: yolo-model-v1

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie detektora UAP
        run: python app.py

      - name: Aktualizacja logów i zapis wyników
        run: |
          git config --global user.name "UAP-Bot"
          git config --global user.email "bot@uap-detector.com"
          
          # Zapisujemy znacznik czasu ostatniego uruchomienia
          date > last_run.txt
          
          git add screenshots/ last_run.txt
          git commit -m "Automatyczna aktualizacja cyklu: $(date)" || exit 0
          git push
