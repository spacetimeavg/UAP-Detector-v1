name: UAP Detector V1

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-detector:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Daje botowi prawo do zapisywania zdjęć w repozytorium

    steps:
      - name: Pobieranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie detektora UAP
        run: python app.py

      - name: Zapisanie wykrytych klatek w repozytorium
        run: |
          git config --global user.name "UAP-Bot"
          git config --global user.email "bot@uap-detector.com"
          git add screenshots/
          git commit -m "Automatyczny zapis wykryć UAP [skip ci]" || exit 0
          git push
